name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the function you called and the input (e.g. the WordPress response or block markup).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
  - type: input
    id: env
    attributes:
      label: Runtime
      placeholder: e.g. Node 22, Next.js 15 App Router, Cloudflare Workers
