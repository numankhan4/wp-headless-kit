name: Feature request
description: Suggest an API or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behaviour
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
