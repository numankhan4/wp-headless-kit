name: PR review

# Claude reviews pull requests and posts the review from the owner's account
# (BOT_PAT), clearly marked as AI-assisted. It never approves, merges or pushes.
#   - pull_request: reviews this repo's own PRs as soon as they open / update
#   - schedule (every 6h) + manual: sweeps open PRs whose latest commit has no
#     review from the owner yet, including Dependabot PRs (their own events
#     can't access secrets, so they are picked up here)

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  targets:
    if: >-
      vars.AUTOMATION_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
       (!github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prs: ${{ steps.find.outputs.prs }}
    env:
      GH_TOKEN: ${{ secrets.BOT_PAT }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - id: find
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'prs=[${{ github.event.pull_request.number }}]' >> "$GITHUB_OUTPUT"; exit 0
          fi
          todo=()
          for n in $(gh pr list --repo "$REPO" --state open --limit 50 --json number,isDraft,headRepositoryOwner \
                       --jq ".[] | select(.isDraft|not) | select(.headRepositoryOwner.login == \"$OWNER\") | .number"); do
            head=$(gh api "repos/$REPO/pulls/$n" --jq .head.sha)
            done_n=$(gh api "repos/$REPO/pulls/$n/reviews" --paginate \
                     --jq "[.[] | select(.user.login == \"$OWNER\" and .commit_id == \"$head\")] | length")
            [ "$done_n" = "0" ] && todo+=("$n")
            [ "${#todo[@]}" -ge 3 ] && break
          done
          json=$(printf '%s\n' "${todo[@]:-}" | jq -Rsc 'split("\n") | map(select(length>0) | tonumber)')
          echo "PRs to review: $json"
          echo "prs=$json" >> "$GITHUB_OUTPUT"

  review:
    needs: targets
    if: needs.targets.outputs.prs != '' && needs.targets.outputs.prs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.targets.outputs.prs) }}
    concurrency:
      group: review-${{ matrix.pr }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.BOT_PAT }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ matrix.pr }}

            Review this pull request as a senior TypeScript reviewer. Read CLAUDE.md for project conventions.
            Focus on: correctness and edge cases, test coverage of the change, public API design and typing,
            security (XSS in HTML helpers, unsafe URL handling), performance, and docs accuracy.
            For dependency bumps, check the changelog risk (major versions, peer dependency conflicts,
            e.g. tools that don't support the installed TypeScript version) and whether CI covers it.

            - Use `gh pr diff ${{ matrix.pr }}` and `gh pr view ${{ matrix.pr }}` to inspect the change.
            - If the inline comment tool (mcp__github_inline_comment__create_inline_comment) is available,
              use it for specific issues with concrete suggestions. Skip nitpicks a formatter would fix.
            - Finish by submitting ONE review with:
                gh pr review ${{ matrix.pr }} --comment --body "<review>"
              The review body must start with exactly this line:
                🤖 AI-assisted review (Claude), posted by the maintainer's automation
              followed by a verdict line: "Verdict: ✅ looks good", "Verdict: ⚠️ minor issues",
              or "Verdict: ❌ changes needed", then a short summary.
            - Never approve, request changes, push commits, or merge. Only use --comment.
          claude_args: |
            --model haiku
            --max-turns 25
            --allowedTools "Read,Glob,Grep,LS,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*)"
