name: PR review

# Claude reviews every non-draft PR from this repo (never forks) and leaves
# inline comments plus a summary. It never approves or merges.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    if: >-
      vars.AUTOMATION_ENABLED == 'true' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request as a senior TypeScript reviewer. Read CLAUDE.md for project conventions.
            Focus on: correctness and edge cases, test coverage of the change, public API design and typing,
            security (XSS in HTML helpers, unsafe URL handling), performance, and docs accuracy.

            - Use `gh pr diff` and `gh pr view` to inspect the change.
            - Leave inline comments with mcp__github_inline_comment__create_inline_comment for specific issues,
              with a concrete suggestion where possible. Skip nitpicks a formatter would fix.
            - Finish with ONE summary comment via `gh pr comment` that starts with a verdict line:
              "Verdict: ✅ looks good", "Verdict: ⚠️ minor issues", or "Verdict: ❌ changes needed".
            - Do not approve, request changes formally, push commits, or merge.
          claude_args: |
            --model haiku
            --max-turns 25
            --allowedTools Read,Glob,Grep,LS,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)
